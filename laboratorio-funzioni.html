<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio Funzioni</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{
  --fs:17px;
  --bg:#eef1f6; --panel:#ffffff; --ink:#111827; --muted:#4b5563; --line:#d1d5db;
  --acc:#1d4ed8; --acc-soft:#dbe6ff; --green:#0a7d34; --red:#c62828; --orange:#c2410c; --purple:#7e22ce;
  --head:#0f172a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 10px;flex-wrap:wrap}
header h1{font-size:1.05em;margin:0 6px 0 4px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tabs button{min-height:48px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:#cbd5e1;font:inherit;font-weight:600;cursor:pointer}
.tabs button:hover{background:#1e293b}
.tabs button[aria-selected=true]{background:#fff;color:var(--head)}
.htools{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid #334155;border-radius:10px;background:#1e293b;color:#fff;font:inherit;font-size:.9em;cursor:pointer}
.hbtn[aria-pressed=true]{background:#f59e0b;border-color:#f59e0b;color:#111}
main{flex:1;display:grid;grid-template-columns:minmax(390px,36%) 1fr;min-height:0}
#left{overflow-y:auto;padding:12px;background:var(--panel);border-right:1px solid var(--line)}
#right{position:relative;min-height:0;background:#fff;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ctools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.ctools button{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.95);font:inherit;font-size:.9em;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hint{position:absolute;left:10px;bottom:8px;font-size:.75em;color:#6b7280;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:6px;pointer-events:none}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;background:#fff}
.card h3{margin:0 0 8px;font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card h4{margin:10px 0 4px;font-size:.9em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;color:var(--ink);font:inherit;cursor:pointer}
.btn:hover{background:#eef2ff}
.btn.on,.btn[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.on .katex,.btn[aria-pressed=true] .katex{color:#fff}
.btn.tg{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:4px 0}
.btn.tg::before{content:"";width:20px;height:20px;border-radius:5px;border:2px solid currentColor;flex:none}
.btn.tg[aria-pressed=true]::before{background:#fff;box-shadow:inset 0 0 0 3px var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.stp{margin:8px 0}
.stp .lab{display:flex;justify-content:space-between;gap:8px;font-size:.92em;color:var(--muted)}
.stp .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.stp .ctl{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.stp .ctl button{height:44px;border:1px solid var(--line);border-radius:10px;background:#f1f5f9;font-size:1.35em;font-weight:700;cursor:pointer;color:var(--ink);touch-action:manipulation}
.stp .ctl button:active{background:var(--acc-soft)}
input[type=range]{width:100%;height:44px;accent-color:var(--acc);margin:0}
.formula{font-size:1.2em;text-align:center;padding:4px 0;overflow-x:auto;overflow-y:hidden}
.kx{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.msg{border-radius:10px;padding:8px 10px;margin:8px 0;border-left:5px solid}
.msg.info{background:#eff6ff;border-color:var(--acc)}
.msg.ok{background:#ecfdf3;border-color:var(--green)}
.msg.warn{background:#fff7ed;border-color:#ea580c}
.msg.err{background:#fef2f2;border-color:var(--red)}
.small{font-size:.88em;color:var(--muted)}
.signtab{border-collapse:collapse;width:100%;font-size:.95em;text-align:center;margin-top:4px}
.signtab td,.signtab th{padding:4px 3px;border-bottom:1px solid var(--line);font-weight:400}
.signtab th:first-child,.signtab td:first-child{text-align:left;white-space:nowrap;padding-right:6px}
.signtab .pt{width:1%;white-space:nowrap;border-left:1px dashed #94a3b8;border-right:1px dashed #94a3b8}
.sp{color:var(--green);font-weight:800;font-size:1.15em}
.sn{color:var(--red);font-weight:800;font-size:1.15em}
.su{color:#9ca3af;background:repeating-linear-gradient(45deg,#fee2e2 0 4px,#fff 4px 8px)}
table.tt{border-collapse:collapse;width:100%;font-size:.88em}
table.tt th,table.tt td{border:1px solid var(--line);padding:5px;vertical-align:top;text-align:left}
table.tt th{background:#f1f5f9}
.stk{display:grid;grid-template-columns:32px 1fr auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;margin:6px 0;background:#fafbff}
.stk .num{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em}
.stk .ops{display:flex;gap:4px}
.stk .ops button{min-width:44px;min-height:44px}
.stk .stp{grid-column:1/-1;margin:0}
.addgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.addgrid .btn{padding:0 4px}
.predict-bar{display:none}
.predicting .predict-bar{display:block}
.predicting .sol{display:none}
.revealed-bar{display:none}
.hidden{display:none!important}
code.tex{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:#f3f4f6;padding:1px 4px;border-radius:4px}
@media (max-width:900px){
  html,body{height:auto}
  body{display:block}
  main{display:flex;flex-direction:column}
  #right{height:62vh;order:-1}
  #left{border-right:0}
}
</style>
</head>
<body>
<header>
  <h1>Laboratorio Funzioni</h1>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="htools">
    <button class="hbtn" id="bPredict" aria-pressed="false" title="Nasconde grafico e soluzioni finché non si formula una previsione">Prevedi → Verifica</button>
    <button class="hbtn" id="bNot" title="Notazione degli intervalli">]a;b[</button>
    <button class="hbtn" id="bFm" title="Riduci caratteri">A−</button>
    <button class="hbtn" id="bFp" title="Ingrandisci caratteri">A+</button>
    <button class="hbtn" id="bFull" title="Schermo intero">⛶</button>
  </div>
</header>
<main>
  <section id="left">
    <div class="predict-bar msg warn" id="predictBar">
      <b>Modalità previsione.</b> Formula la tua congettura (dominio, segno, forma del grafico...) prima di verificare.
      <div class="row" style="margin-top:6px"><button class="btn on" id="bReveal">Mostra soluzione</button></div>
    </div>
    <div class="revealed-bar msg ok" id="revealedBar">Soluzione visibile. Cambiando un parametro si torna in modalità previsione.</div>
  </section>
  <section id="right">
    <canvas id="cv"></canvas>
    <div class="ctools">
      <button id="bReset" title="Ripristina la vista">⟲ Vista</button>
      <button id="bPng" title="Scarica il grafico in PNG ad alta risoluzione">⤓ PNG</button>
    </div>
    <div class="hint">Trascina per spostare · rotellina o due dita per zoom · trascina i cursori arancioni</div>
  </section>
</main>
<script>
'use strict';
/* =====================================================================
   NUCLEO: stato globale, formattazione, insiemi, widget, motore grafico
   ===================================================================== */
const APP = { fs: 17, notation: 'ita', predict: false, revealed: false, mod: null };
const INF = Infinity;
const $ = (s, r = document) => r.querySelector(s);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function K(t, d = false) {
  if (window.katex) {
    try { return katex.renderToString(t, { displayMode: d, throwOnError: false, strict: 'ignore' }); } catch (e) { /* fallback */ }
  }
  return '<code class="tex">' + esc(t) + '</code>';
}
/* LaTeX -> testo semplice (didascalie PNG) */
function plain(t) {
  let s = t;
  for (let i = 0; i < 6; i++) {
    s = s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)')
      .replace(/\\sqrt\[3\]\{([^{}]*)\}/g, '∛($1)')
      .replace(/\\sqrt\{([^{}]*)\}/g, '√($1)')
      .replace(/\^\{([^{}]*)\}/g, '^($1)')
      .replace(/\\log_\{([^{}]*)\}/g, 'log_$1');
  }
  return s.replace(/\\left|\\right/g, '').replace(/\\cdot/g, '·').replace(/\\ln/g, 'ln').replace(/\\circ/g, '∘')
    .replace(/\\operatorname/g, '').replace(/\^2/g, '²').replace(/\^3/g, '³').replace(/\\[,;:! ]/g, ' ')
    .replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '').replace(/-/g, '−').replace(/\s+/g, ' ')
    .replace(/\(([\w.,²³]+)\)\//g, '$1/').replace(/\/\(([\w.,²³]+)\)/g, '/$1').trim();
}
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const range = (a, b, st) => { const o = []; for (let v = a; v <= b + 1e-9; v += st) o.push(Math.round(v * 1e6) / 1e6); return o; };
const r6 = v => Math.round(v * 1e6) / 1e6;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Numeri ---------- */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function approxFrac(x, maxD = 12) {
  if (!isFinite(x)) return null;
  for (let d = 1; d <= maxD; d++) { const n = Math.round(x * d); if (Math.abs(n / d - x) < 1e-9) return [n, d]; }
  return null;
}
function decStr(x, dig = 3) { let s = String(+x.toFixed(dig)); if (s === '-0') s = '0'; return s; }
/* numero in LaTeX: intero, frazione, radice, decimale con virgola */
function N(x) {
  if (x === INF) return '+\\infty';
  if (x === -INF) return '-\\infty';
  if (Math.abs(x) < 1e-12) return '0';
  const f = approxFrac(x);
  if (f) { const [n, d] = f; return d === 1 ? String(n) : (n < 0 ? '-' : '') + '\\frac{' + Math.abs(n) + '}{' + d + '}'; }
  const q = x * x, r = Math.round(q);
  if (r > 1 && Math.abs(q - r) < 1e-9) return (x < 0 ? '-' : '') + '\\sqrt{' + r + '}';
  const iq = 1 / (x * x), ir = Math.round(iq);
  if (ir > 1 && Math.abs(iq - ir) < 1e-9) return (x < 0 ? '-' : '') + '\\frac{1}{\\sqrt{' + ir + '}}';
  return decStr(x).replace('.', '{,}');
}
/* numero in testo semplice (canvas) */
function T(x) {
  if (x === INF) return '+∞';
  if (x === -INF) return '−∞';
  if (Math.abs(x) < 1e-12) return '0';
  if (Math.abs(x * 1000 - Math.round(x * 1000)) < 1e-9) return decStr(x, 3).replace('-', '−').replace('.', ',');
  const f = approxFrac(x, 12);
  if (f) return (f[0] < 0 ? '−' : '') + Math.abs(f[0]) + (f[1] === 1 ? '' : '/' + f[1]);
  const q = x * x, r = Math.round(q);
  if (r > 1 && r < 50 && Math.abs(q - r) < 1e-9) return (x < 0 ? '−' : '') + '√' + r;
  return decStr(x, 2).replace('-', '−').replace('.', ',');
}
const P2 = (x, y) => '(' + T(x) + '; ' + T(y) + ')';
const DN = v => isFinite(v) && Math.abs(v * 1000 - Math.round(v * 1000)) < 1e-9 ? decStr(v, 3).replace('.', '{,}') : N(v);
const DEC = v => K(isFinite(v) ? decStr(v, 2).replace('.', '{,}').replace('-', '-') : N(v));
const PT = (x, y) => '\\left(' + N(x) + ';\\,' + N(y) + '\\right)';
/* polinomio pulito: terms = [[coeff, 'x^2'], [coeff, 'x'], [coeff, '']] */
function poly(terms) {
  let out = '';
  for (const [c, t] of terms) {
    if (Math.abs(c) < 1e-12) continue;
    const neg = c < 0, a = Math.abs(c);
    const body = t === '' ? N(a) : (Math.abs(a - 1) < 1e-12 ? '' : N(a)) + t;
    out += out === '' ? (neg ? '-' : '') + body : (neg ? ' - ' : ' + ') + body;
  }
  return out || '0';
}
/* frazione con segno portato davanti */
const fr = (c, den) => (c < 0 ? '-' : '') + '\\dfrac{' + N(Math.abs(c)) + '}{' + den + '}';
function chain(lines, rel = '\\iff') {
  const L = lines.filter((l, i) => i === 0 || l !== lines[i - 1]);
  if (L.length === 1) return '<div class="kx">' + K(L[0], true) + '</div>';
  return '<div class="kx">' + K('\\begin{aligned}' + L.map((l, i) => (i ? rel + '\\;' : '') + '&' + l).join('\\\\[2pt]') + '\\end{aligned}', true) + '</div>';
}

/* ---------- Insiemi di R come unioni di intervalli ---------- */
const eq = (a, b) => a === b || Math.abs(a - b) < 1e-9;
function I(a, b, ca = false, cb = false) { return { a, b, ca: !!ca && isFinite(a), cb: !!cb && isFinite(b) }; }
const RR = () => [I(-INF, INF)];
function Rminus(pts) {
  const s = [...new Set(pts)].sort((a, b) => a - b), out = [];
  let prev = -INF;
  for (const p of s) { out.push(I(prev, p)); prev = p; }
  out.push(I(prev, INF));
  return out;
}
function normalize(S) {
  const L = S.filter(t => t.a < t.b || (eq(t.a, t.b) && t.ca && t.cb)).map(t => ({ ...t }))
    .sort((x, y) => (x.a < y.a ? -1 : x.a > y.a ? 1 : 0) || (y.ca - x.ca));
  const out = [];
  for (const t of L) {
    const c = out[out.length - 1];
    if (c && (t.a < c.b && !eq(t.a, c.b) || (eq(t.a, c.b) && (c.cb || t.ca)))) {
      if (t.b > c.b && !eq(t.b, c.b)) { c.b = t.b; c.cb = t.cb; } else if (eq(t.b, c.b)) c.cb = c.cb || t.cb;
    } else out.push(t);
  }
  return out;
}
function intersect(S, Tt) {
  const out = [];
  for (const s of S) for (const t of Tt) {
    let a, ca, b, cb;
    if (eq(s.a, t.a)) { a = s.a; ca = s.ca && t.ca; } else if (s.a > t.a) { a = s.a; ca = s.ca; } else { a = t.a; ca = t.ca; }
    if (eq(s.b, t.b)) { b = s.b; cb = s.cb && t.cb; } else if (s.b < t.b) { b = s.b; cb = s.cb; } else { b = t.b; cb = t.cb; }
    if (a < b || (eq(a, b) && ca && cb)) out.push(I(a, b, ca, cb));
  }
  return normalize(out);
}
const union = (...Ss) => normalize(Ss.flat());
function complement(S) {
  const L = normalize(S), out = [];
  let a = -INF, ca = false;
  for (const t of L) { out.push(I(a, t.a, ca, !t.ca)); a = t.b; ca = !t.cb; }
  out.push(I(a, INF, ca, false));
  return normalize(out);
}
const mirror = S => normalize(S.map(t => I(-t.b, -t.a, t.cb, t.ca)));
function setEq(S, Tt) {
  const A = normalize(S), B = normalize(Tt);
  return A.length === B.length && A.every((t, i) => eq(t.a, B[i].a) && eq(t.b, B[i].b) && t.ca === B[i].ca && t.cb === B[i].cb);
}
function inSet(S, x) {
  for (const t of S) {
    if (eq(x, t.a)) { if (t.ca) return true; continue; }
    if (eq(x, t.b)) { if (t.cb) return true; continue; }
    if (x > t.a && x < t.b) return true;
  }
  return false;
}
function endpoints(S) {
  const o = [];
  for (const t of S) { if (isFinite(t.a)) o.push(t.a); if (isFinite(t.b)) o.push(t.b); }
  return [...new Set(o)].sort((a, b) => a - b);
}
function nearestIn(S, x) {
  if (inSet(S, x) || !S.length) return x;
  let best = x, bd = INF;
  for (const t of S) for (const [e, c, dir] of [[t.a, t.ca, 1], [t.b, t.cb, -1]]) {
    if (!isFinite(e)) continue;
    const cand = c ? e : e + dir * Math.min(0.05, (t.b - t.a) / 4);
    const d = Math.abs(cand - x);
    if (d < bd) { bd = d; best = cand; }
  }
  return best;
}
function ivTex(t) {
  const it = APP.notation === 'ita';
  if (eq(t.a, t.b)) return '\\{' + N(t.a) + '\\}';
  const L = t.ca ? '[' : (it ? ']' : '('), R = t.cb ? ']' : (it ? '[' : ')');
  return '\\left' + L + N(t.a) + ';\\,' + N(t.b) + '\\right' + R;
}
function setTex(S) {
  if (!S.length) return '\\varnothing';
  if (S.length === 1 && S[0].a === -INF && S[0].b === INF) return '\\mathbb{R}';
  return S.map(ivTex).join(' \\cup ');
}
function rMinusPoints(S) {
  if (!S.length || S[0].a !== -INF || S[S.length - 1].b !== INF || S.length < 2) return null;
  const pts = [];
  for (let i = 0; i < S.length - 1; i++) {
    if (!eq(S[i].b, S[i + 1].a) || S[i].cb || S[i + 1].ca) return null;
    pts.push(S[i].b);
  }
  return pts;
}
function condTex(t, v = 'x') {
  if (t.a === -INF && t.b === INF) return v + '\\in\\mathbb{R}';
  if (eq(t.a, t.b)) return v + ' = ' + N(t.a);
  if (t.a === -INF) return v + (t.cb ? ' \\le ' : ' < ') + N(t.b);
  if (t.b === INF) return v + (t.ca ? ' \\ge ' : ' > ') + N(t.a);
  return N(t.a) + (t.ca ? ' \\le ' : ' < ') + v + (t.cb ? ' \\le ' : ' < ') + N(t.b);
}
function setBuilder(S, v = 'x') {
  if (!S.length) return '\\varnothing';
  if (S.length === 1 && S[0].a === -INF && S[0].b === INF) return '\\mathbb{R}';
  const pts = rMinusPoints(S);
  if (pts) return '\\left\\{' + v + '\\in\\mathbb{R} \\mid ' + pts.map(p => v + '\\neq ' + N(p)).join(' \\,\\land\\, ') + '\\right\\}';
  return '\\left\\{' + v + '\\in\\mathbb{R} \\mid ' + S.map(t => condTex(t, v)).join(' \\,\\lor\\, ') + '\\right\\}';
}
function setAlt(S) {
  const pts = rMinusPoints(S);
  return pts ? '\\mathbb{R}\\setminus\\left\\{' + pts.map(N).join(';\\,') + '\\right\\}' : null;
}

/* ---------- Widget ---------- */
function stepper(o) {
  const vals = o.values || range(o.min, o.max, o.step);
  const fmt = o.fmt || (v => K(N(v)));
  let cur = o.value;
  const valid = v => !o.valid || o.valid(v);
  const lab = h('b');
  const rng = h('input', { type: 'range', min: 0, max: vals.length - 1, step: 1, 'aria-label': o.aria || 'valore' });
  const idxOf = v => {
    let bi = 0, bd = INF;
    vals.forEach((w, i) => { const d = w === v ? 0 : Math.abs(w - v); if (!isNaN(d) && d < bd) { bd = d; bi = i; } });
    return bi;
  };
  const show = () => { lab.innerHTML = fmt(cur); rng.value = idxOf(cur); };
  const set = (v, fire = true) => { cur = v; show(); if (fire) o.onChange(v); };
  const move = dir => {
    const bs = o.bstep || 1;
    let cnt = 0, last = null;
    for (let j = dir > 0 ? 0 : vals.length - 1; j >= 0 && j < vals.length; j += dir) {
      const w = vals[j];
      const beyond = dir > 0 ? (w > cur && !eq(w, cur)) : (w < cur && !eq(w, cur));
      if (beyond && valid(w)) { cnt++; last = w; if (cnt === bs) break; }
    }
    if (last !== null) set(last);
  };
  rng.addEventListener('input', () => {

function analyze1(m) {
  const crit = [...new Set([...endpoints(m.dom), ...m.zeros])].sort((a, b) => a - b);
  const mid = (a, b) => a === -INF ? (b === INF ? 0 : b - 1) : b === INF ? a + 1 : (a + b) / 2;
  const sAt = x => {
    if (!inSet(m.dom, x)) return 'n';
    const v = m.f(x);
    if (!isFinite(v)) return 'n';
    if (Math.abs(v) < 1e-6) return '0';
    return v > 0 ? '+' : '-';
  };
  const els = [];
  let prev = -INF;
  for (const c of crit) { els.push({ t: 'iv', a: prev, b: c, m: mid(prev, c) }); els.push({ t: 'pt', x: c }); prev = c; }
  els.push({ t: 'iv', a: prev, b: INF, m: mid(prev, INF) });
  for (const e of els) e.s = sAt(e.t === 'iv' ? e.m : e.x);
  const close = (c, e) => e.t === 'pt' ? I(c.a, e.x, c.ca, true) : I(c.a, e.b, c.ca, false);
  const run = pred => {
    const out = [];
    let cur = null, end = null;
    for (const e of els) {
      if (pred(e.s)) { if (!cur) cur = e.t === 'pt' ? { a: e.x, ca: true } : { a: e.a, ca: false }; end = e; }
      else if (cur) { out.push(close(cur, end)); cur = null; }
    }
    if (cur) out.push(close(cur, end));
    return normalize(out);
  };
  return { els, pos: run(s => s === '+'), neg: run(s => s === '-') };
}
function signTable(A, factors) {
  const els = A.els;
  const cell = s => s === '+' ? '<td class="sp">+</td>' : s === '-' ? '<td class="sn">−</td>' : s === '0' ? '<td>0</td>' : s === 'n' ? '<td class="su">∄</td>' : '<td></td>';
  let t = '<div class="kx"><table class="signtab"><tr><th></th>' + els.map(e => e.t === 'pt' ? `<th class="pt">${K(N(e.x))}</th>` : '<th></th>').join('') + '</tr>';
  for (const f of factors) {
    t += '<tr><td>' + K(f.tex) + '</td>' + els.map(e => {
      if (e.t === 'iv') { const v = f.fn(e.m); return cell(v > 0 ? '+' : v < 0 ? '-' : '0'); }
      return `<td class="pt">${Math.abs(f.fn(e.x)) < 1e-9 ? '0' : ''}</td>`;
    }).join('') + '</tr>';
  }
  t += '<tr><td><b>' + K('f(x)') + '</b></td>' + els.map(e => e.t === 'iv' ? cell(e.s) : `<td class="pt">${e.s === '0' ? '0' : e.s === 'n' ? '∄' : ''}</td>`).join('') + '</tr></table></div>';
  return t;
}

const EXPB = [{ v: 1 / 3, t: '\\tfrac{1}{3}' }, { v: 0.5, t: '\\tfrac{1}{2}' }, { v: 2, t: '2' }, { v: Math.E, t: 'e' }, { v: 3, t: '3' }];
const IM = '\\operatorname{Im}';
const CRES = '\\text{strettamente crescente}', DECR = '\\text{strettamente decrescente}';
const F2 = {
  lin: {
    label: 'Lineare', tex: 'mx+q', params: [{ id: 'm', def: 2 }, { id: 'q', def: 1 }],
    mk({ m, q }) {
      const tex = poly([[m, 'x'], [q, '']]);
      return {
        tex, f: x => m * x + q, nat: RR(), poles: [], splits: [],
        lim: x => isFinite(x) ? m * x + q : (m === 0 ? q : ((x > 0) === (m > 0) ? INF : -INF)),
        mono: m > 0 ? K(`f\\ ${CRES} \\text{ in } \\mathbb{R}`) + ' (coefficiente angolare ' + K('m > 0') + ')'
          : m < 0 ? K(`f\\ ${DECR} \\text{ in } \\mathbb{R}`) + ' (coefficiente angolare ' + K('m < 0') + ')'
            : 'f è costante: non è strettamente monotona e non è iniettiva.',
        solve: k => m !== 0 ? [(k - q) / m] : (eq(k, q) ? 'inf' : []),
        inj: () => m !== 0,
        inv: () => ({
          lines: [`y = ${tex}`, `${poly([[m, 'x']])} = ${poly([[1, 'y'], [-q, '']])}`, `x = ${poly([[1 / m, 'y'], [-q / m, '']])}`],
          tex: v => poly([[1 / m, v], [-q / m, '']]), f: x => (x - q) / m, poles: []
        })
      };
    }
  },
  par: {
    label: 'Parabola', tex: 'ax^2+b', params: [{ id: 'a', def: 1, nz: true, min: -3, max: 3 }, { id: 'b', def: -2 }],
    mk({ a, b }) {
      const tex = poly([[a, 'x^2'], [b, '']]);
      const L = ivTex(I(-INF, 0, false, true)), R = ivTex(I(0, INF, true));
      return {
        tex, f: x => a * x * x + b, nat: RR(), poles: [], splits: [0],
        lim: x => isFinite(x) ? a * x * x + b : (a > 0 ? INF : -INF),

function imageOf(F, D) {
  const pieces = [];
  for (const t of D) {
    const cuts = [t.a, ...F.splits.filter(s => s > t.a && s < t.b), t.b];
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      const ca = i === 0 ? t.ca : true, cb = i === cuts.length - 2 ? t.cb : true;
      if (eq(a, b)) { pieces.push(I(F.f(a), F.f(a), true, true)); continue; }
      const va = ca ? F.f(a) : F.lim(a, 1), vb = cb ? F.f(b) : F.lim(b, -1);
      if (eq(va, vb)) pieces.push(I(va, va, true, true));
      else if (va < vb) pieces.push(I(va, vb, ca, cb)); else pieces.push(I(vb, va, cb, ca));
    }
  }
  return normalize(pieces);
}

      const near = (APP.mod.handles ? APP.mod.handles() : []).some(hd => Math.hypot(hd.x - p.x, hd.y - p.y) < 28);
      c.style.cursor = near ? 'grab' : 'crosshair';
      return;
    }
    ptrs.set(e.pointerId, p);
    if (!drag) return;
    if (drag.kind === 'h') { drag.moved += 1; drag.h.drag(p.x, p.y); }
    else if (drag.kind === 'pan') {
      const v = APP.mod.view;
      v.cx -= (p.x - drag.last.x) / v.s; v.cy += (p.y - drag.last.y) / v.s;
      drag.moved += Math.abs(p.x - drag.last.x) + Math.abs(p.y - drag.last.y);
      drag.last = p; redraw();
    } else if (drag.kind === 'pinch' && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (drag.d0 > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / drag.d0);
      drag.d0 = d;
    }
  });
  const up = e => {
    const p = pos(e);
    if (drag && drag.kind === 'pan' && drag.moved < 6 && ptrs.size === 1 && APP.mod.tap) APP.mod.tap(p.x, p.y);
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) drag = null;
    else if (ptrs.size === 1) { const q = [...ptrs.values()][0]; drag = { kind: 'pan', start: q, last: q, moved: 99 }; }
  };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  c.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });
}
function exportPNG() {
  const sc = 3, W = CV.W, H = CV.H, capH = 64;
  const c = document.createElement('canvas');
  c.width = Math.round(W * sc); c.height = Math.round((H + capH) * sc);
  const x = c.getContext('2d');
  paint(x, W, H, sc);
  x.setTransform(sc, 0, 0, sc, 0, 0);
  x.fillStyle = '#fff'; x.fillRect(0, H, W, capH);
  x.strokeStyle = '#d1d5db'; x.beginPath(); x.moveTo(0, H + .5); x.lineTo(W, H + .5); x.stroke();
  x.fillStyle = '#111'; x.font = '600 17px system-ui,sans-serif'; x.textBaseline = 'alphabetic';
  x.fillText(APP.mod.caption(), 14, H + 28);
  x.font = '13px system-ui,sans-serif'; x.fillStyle = '#555';
  x.fillText('Laboratorio Funzioni — ' + APP.mod.title + ' — ' + new Date().toLocaleDateString('it-IT'), 14, H + 50);
  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'funzioni-modulo' + (MODS.indexOf(APP.mod) + 1) + '.png';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, 'image/png');
}
function refreshAll() { MODS.forEach(m => { if (m.root) m.update(); }); }
window.addEventListener('DOMContentLoaded', () => {
  CV.c = $('#cv'); CV.ctx = CV.c.getContext('2d');
  const tabs = $('#tabs');
  MODS.forEach((m, i) => tabs.append(h('button', { type: 'button', role: 'tab', onclick: () => selectTab(i) }, m.title)));
  $('#bPredict').addEventListener('click', () => { APP.predict = !APP.predict; APP.revealed = false; syncPredict(); });
  $('#bReveal').addEventListener('click', () => { APP.revealed = true; syncPredict(); });
  $('#bNot').addEventListener('click', e => { APP.notation = APP.notation === 'ita' ? 'int' : 'ita'; e.target.textContent = APP.notation === 'ita' ? ']a;b[' : '(a;b)'; refreshAll(); });
  const setFs = d => { APP.fs = clamp(APP.fs + d, 13, 26); document.documentElement.style.setProperty('--fs', APP.fs + 'px'); redraw(); };
  $('#bFm').addEventListener('click', () => setFs(-1));
  $('#bFp').addEventListener('click', () => setFs(1));
  $('#bFull').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); });
  $('#bReset').addEventListener('click', () => { const v = APP.mod.view; v.cx = 0; v.cy = 0; v.s = 0; redraw(); });
  $('#bPng').addEventListener('click', exportPNG);
  new ResizeObserver(resize).observe($('#right'));
  initPointer();
  selectTab(0);
  resize();
  if (!window.katex) $('#left').prepend(h('div', { class: 'msg warn', html: '<b>KaTeX non disponibile</b> (nessuna connessione a Internet): le formule sono mostrate in forma testuale LaTeX. Tutte le funzioni grafiche restano attive.' }));
});
</script>
